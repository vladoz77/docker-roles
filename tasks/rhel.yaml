# tasks/rhel.yaml
- name: Include RedHat-family vars
  ansible.builtin.include_vars: rhel.yaml

- name: Add Docker repository
  ansible.builtin.get_url:
    url: "{{ docker_repo_url }}"
    dest: "{{ docker_repo_dest }}"
    mode: "0644"

- name: Install Docker packages
  ansible.builtin.dnf:
    name: "{{ docker_packages }}"
    state: present